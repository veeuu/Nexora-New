# Nexora Nginx Configuration
# Domain: nexora.proplusdata.co
# Backend: http://localhost:5000
# Frontend: http://localhost:5173
# EC2 IP: 18.234.40.182

# ============================================
# HOW TO GET FREE SSL CERTIFICATE:
# ============================================
# 1. Install Certbot:
#    sudo apt update
#    sudo apt install -y certbot python3-certbot-nginx
#
# 2. Get SSL Certificate (automatic):
#    sudo certbot --nginx -d nexora.proplusdata.co -d www.nexora.proplusdata.co
#
# 3. Follow prompts:
#    - Enter your email
#    - Agree to terms (A)
#    - Choose redirect option (2)
#
# 4. Certbot will automatically:
#    - Get the certificate
#    - Update this config file
#    - Enable HTTPS
#    - Set up auto-renewal
#
# 5. Test auto-renewal:
#    sudo certbot renew --dry-run
#
# Certificate will be saved at:
# /etc/letsencrypt/live/nexora.proplusdata.co/fullchain.pem
# /etc/letsencrypt/live/nexora.proplusdata.co/privkey.pem
# ============================================

# Redirect HTTP to HTTPS
# Nexora Nginx Configuration - PRODUCTION
# Domain: nexora.proplusdata.co
# Backend: http://localhost:5000
# Frontend: serve from dist folder

# Redirect HTTP to HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name nexora.proplusdata.co www.nexora.proplusdata.co;
    return 301 https://$server_name$request_uri;
}

# HTTPS server
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name nexora.proplusdata.co www.nexora.proplusdata.co;

    # SSL (Let's Encrypt)
    ssl_certificate /etc/letsencrypt/live/nexora.proplusdata.co/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/nexora.proplusdata.co/privkey.pem;
    ssl_trusted_certificate /etc/letsencrypt/live/nexora.proplusdata.co/chain.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384';
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    ssl_stapling on;
    ssl_stapling_verify on;

    access_log /var/log/nginx/nexora-ssl-access.log;
    error_log /var/log/nginx/nexora-ssl-error.log;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;

    client_max_body_size 50M;

    # API (keep /api intact)
    location /api/ {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;

        proxy_connect_timeout 600s;
        proxy_send_timeout 600s;
        proxy_read_timeout 600s;
        send_timeout 600s;

        proxy_buffering on;
        proxy_buffer_size 4k;
        proxy_buffers 8 4k;
        proxy_busy_buffers_size 8k;
    }

    # Frontend (React build)
    location / {
        root /home/ubuntu/Nexora-New/frontend/dist;
        try_files $uri $uri/ /index.html;

        add_header Access-Control-Allow-Origin * always;

        location ~* \.html$ {
            add_header Cache-Control "no-cache, no-store, must-revalidate";
            add_header Pragma "no-cache";
            add_header Expires "0";
        }
    }

    # Logos
    location /logos/ {
        alias /home/ubuntu/Nexora-New/frontend/dist/logos/;
        expires 30d;
        add_header Cache-Control "public, immutable" always;
        add_header Access-Control-Allow-Origin * always;
        try_files $uri =404;
    }

    # Static assets
    location ~* \.(jpg|jpeg|png|gif|ico|css|js|svg|woff|woff2|ttf|eot|webp|avif)$ {
        root /home/ubuntu/Nexora-New/frontend/dist;
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        add_header Access-Control-Allow-Origin * always;
    }

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml text/javascript 
               application/x-javascript application/xml+rss 
               application/json application/javascript 
               application/xml image/svg+xml;
    gzip_disable "msie6";
}
