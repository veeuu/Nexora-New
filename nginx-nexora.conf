# Nexora Nginx Configuration
# Domain: nexora.proplusdata.co
# Backend: http://localhost:5000
# Frontend: http://localhost:5173
# EC2 IP: 18.234.40.182

# ============================================
# HOW TO GET FREE SSL CERTIFICATE:
# ============================================
# 1. Install Certbot:
#    sudo apt update
#    sudo apt install -y certbot python3-certbot-nginx
#
# 2. Get SSL Certificate (automatic):
#    sudo certbot --nginx -d nexora.proplusdata.co -d www.nexora.proplusdata.co
#
# 3. Follow prompts:
#    - Enter your email
#    - Agree to terms (A)
#    - Choose redirect option (2)
#
# 4. Certbot will automatically:
#    - Get the certificate
#    - Update this config file
#    - Enable HTTPS
#    - Set up auto-renewal
#
# 5. Test auto-renewal:
#    sudo certbot renew --dry-run
#
# Certificate will be saved at:
# /etc/letsencrypt/live/nexora.proplusdata.co/fullchain.pem
# /etc/letsencrypt/live/nexora.proplusdata.co/privkey.pem
# ============================================

# Redirect HTTP to HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name nexora.proplusdata.co www.nexora.proplusdata.co;
    
    # Redirect all HTTP traffic to HTTPS
    return 301 https://$server_name$request_uri;
}


# HTTPS server block with SSL
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name nexora.proplusdata.co www.nexora.proplusdata.co;

    # SSL certificate paths (Let's Encrypt)
    ssl_certificate /etc/letsencrypt/live/nexora.proplusdata.co/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/nexora.proplusdata.co/privkey.pem;
    ssl_trusted_certificate /etc/letsencrypt/live/nexora.proplusdata.co/chain.pem;

    # SSL configuration
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384';
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    ssl_stapling on;
    ssl_stapling_verify on;

    # Logging
    access_log /var/log/nginx/nexora-ssl-access.log;
    error_log /var/log/nginx/nexora-ssl-error.log;

    # Security headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;

    # Max upload size
    client_max_body_size 50M;

   # Backend API
location /api/ {
    proxy_pass http://127.0.0.1:5000/;

    proxy_http_version 1.1;

    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
   
        # Timeouts for long-running requests (cache building, etc.)
        proxy_connect_timeout 600s;
        proxy_send_timeout 600s;
        proxy_read_timeout 600s;
        send_timeout 600s;
        
        # Buffering
        proxy_buffering on;
        proxy_buffer_size 4k;
        proxy_buffers 8 4k;
        proxy_busy_buffers_size 8k;
        
        # Cache bypass
        proxy_cache_bypass $http_upgrade;
    }

    # Frontend - React application on port 5173
# Frontend
location / {
    proxy_pass http://127.0.0.1:5173;

    proxy_http_version 1.1;

    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
        
        # Cache bypass
        proxy_cache_bypass $http_upgrade;
        
        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # Static files caching
    location ~* \.(jpg|jpeg|png|gif|ico|css|js|svg|woff|woff2|ttf|eot)$ {
        proxy_pass http://localhost:5173;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml text/javascript 
               application/x-javascript application/xml+rss 
               application/json application/javascript 
               application/xml image/svg+xml;
    gzip_disable "msie6";
}
