# Nexora Nginx Configuration - PRODUCTION
# Domain: nexora.proplusdata.co
# Backend: http://localhost:5000
# Frontend: Serve from dist folder (built files)
# EC2 IP: 18.234.40.182

# IMPORTANT: Replace /path/to/Nexora-New with your actual project path!

# Redirect HTTP to HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name nexora.proplusdata.co www.nexora.proplusdata.co;
    
    # Redirect all HTTP traffic to HTTPS
    return 301 https://$server_name$request_uri;
}

# HTTPS server block with SSL
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name nexora.proplusdata.co www.nexora.proplusdata.co;

    # SSL certificate paths (Let's Encrypt)
    ssl_certificate /etc/letsencrypt/live/nexora.proplusdata.co/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/nexora.proplusdata.co/privkey.pem;
    ssl_trusted_certificate /etc/letsencrypt/live/nexora.proplusdata.co/chain.pem;

    # SSL configuration
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384';
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    ssl_stapling on;
    ssl_stapling_verify on;

    # Logging
    access_log /var/log/nginx/nexora-ssl-access.log;
    error_log /var/log/nginx/nexora-ssl-error.log;

    # Security headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;

    # Max upload size
    client_max_body_size 50M;

    # Backend API - All /api requests go to port 5000
    location /api {
        proxy_pass http://localhost:5000;
        proxy_http_version 1.1;
        
        # WebSocket support
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        
        # Headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        
        # Timeouts for long-running requests (cache building, etc.)
        proxy_connect_timeout 600s;
        proxy_send_timeout 600s;
        proxy_read_timeout 600s;
        send_timeout 600s;
        
        # Buffering
        proxy_buffering on;
        proxy_buffer_size 4k;
        proxy_buffers 8 4k;
        proxy_busy_buffers_size 8k;
        
        # Cache bypass
        proxy_cache_bypass $http_upgrade;
    }

    # Frontend - Serve built files from dist folder (PRODUCTION)
    location / {
        # IMPORTANT: Replace with your actual project path!
        root /path/to/Nexora-New/frontend/dist;
        try_files $uri $uri/ /index.html;
        
        # Enable CORS for assets
        add_header Access-Control-Allow-Origin * always;
        
        # Cache control for HTML files (no cache)
        location ~* \.html$ {
            add_header Cache-Control "no-cache, no-store, must-revalidate";
            add_header Pragma "no-cache";
            add_header Expires "0";
        }
    }

    # Logos - Explicit location for logo files
    location /logos/ {
        # IMPORTANT: Replace with your actual project path!
        alias /path/to/Nexora-New/frontend/dist/logos/;
        expires 30d;
        add_header Cache-Control "public, immutable" always;
        add_header Access-Control-Allow-Origin * always;
        
        # Try to serve the file, return 404 if not found
        try_files $uri =404;
    }

    # Static assets - Long cache for versioned files
    location ~* \.(jpg|jpeg|png|gif|ico|css|js|svg|woff|woff2|ttf|eot|webp|avif)$ {
        # IMPORTANT: Replace with your actual project path!
        root /path/to/Nexora-New/frontend/dist;
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        add_header Access-Control-Allow-Origin * always;
    }

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml text/javascript 
               application/x-javascript application/xml+rss 
               application/json application/javascript 
               application/xml image/svg+xml;
    gzip_disable "msie6";
}
